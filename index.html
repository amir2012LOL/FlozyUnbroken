/* navigation */
function go(i,silent){const el=$("#s"+i);if(!el)return;el.scrollIntoView({behavior:"smooth",block:"start"});$("#nav").classList.remove("open");$("#menu").setAttribute("aria-expanded","false");if(!silent)toast(t("found")+title(i))}
document.addEventListener("click",e=>{
 const g=e.target.closest("[data-go]");if(g){e.preventDefault();go(+g.dataset.go,true)}
 const n=e.target.closest("[data-nolink]");if(n){e.preventDefault();toast(t("nolink"))}
});
$("#menu").onclick=()=>{const o=$("#nav").classList.toggle("open");$("#menu").setAttribute("aria-expanded",o)};
$("#top").onclick=()=>go(0,true);

/* hashtag search */
const norm=v=>v.toUpperCase().replace(/\s+/g,"").replace(/^#+/,"");
function find(v){v=norm(v);if(!v)return -1;return S.findIndex(s=>s[0].some(a=>a===v))}
function suggest(){const v=norm($("#q").value),ul=$("#sug");
 const m=S.map((s,i)=>[i,s[0]]).filter(([i,a])=>!v||a.some(x=>x.includes(v)));
 ul.innerHTML=m.map(([i,a])=>`<li tabindex="0" data-i="${i}">#${a[0]} — ${title(i)}</li>`).join("");ul.style.display=m.length?"block":"none"}
$("#q").addEventListener("input",suggest);$("#q").addEventListener("focus",suggest);
$("#sug").addEventListener("click",e=>{const l=e.target.closest("li");if(l){$("#q").value="";$("#sug").style.display="none";go(+l.dataset.i)}});
$("#sug").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.click()});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))$("#sug").style.display="none"});
$("#sf").addEventListener("submit",e=>{e.preventDefault();const i=find($("#q").value);
 if(i<0)toast(t("notfound")+"#"+S.slice(1,5).map(s=>s[0][0]).join(", #"));
 else{$("#q").value="";$("#q").blur();$("#sug").style.display="none";go(i)}});

$("#lang").onclick=()=>{lang=lang==="ru"?"en":"ru";try{sessionStorage.setItem("fz-lang",lang)}catch(e){}const y=scrollY;render();scrollTo(0,y)};

function observe(){if(io)io.disconnect();
 io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add("in");const c=en.target.querySelector(".stat");if(c&&!c.done){c.done=1;count(c)}io.unobserve(en.target)}}),{threshold:.15});
 $$(".rv").forEach(e=>io.observe(e))}
function count(el){const raw=el.dataset.n,num=parseInt(raw.replace(/\D/g,"")),suf=raw.replace(/[\d\s]/g,""),sp=raw.includes(" ")?" ":",";
 const fmt=n=>(lang==="ru"?n.toLocaleString("ru-RU"):n.toLocaleString("en-US"))+suf;
 if(matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=fmt(num);return}
 const st=performance.now();(function f(now){const p=Math.min((now-st)/1400,1);el.textContent=fmt(Math.round(num*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(f)})(st)}

/* scroll progress + active section */
function spy(){const hs=$$("section");const a=$$("#nav a");
 const sc=()=>{const h=document.documentElement;$("#prog").style.width=(scrollY/(h.scrollHeight-innerHeight)*100)+"%";
  let cur=0;hs.forEach((s,i)=>{if(s.getBoundingClientRect().top<innerHeight*.4)cur=i});
  a.forEach((x,i)=>x.classList.toggle("act",i===cur));$("#top").style.display=scrollY>600?"block":"none"};
 removeEventListener("scroll",window._sc);window._sc=sc;addEventListener("scroll",sc,{passive:true});sc()}

/* music player */
const au=$("#au");
$("#play").onclick=()=>{if(au.paused){au.volume=+$("#vol").value;au.play().then(()=>$("#play").innerHTML="&#10074;&#10074;").catch(()=>toast("audio/background-music.mp3 ?"))}else{au.pause();$("#play").innerHTML="&#9654;"}};
$("#vol").oninput=e=>au.volume=+e.target.value;

/* particles (light, paused when hidden) */
(function(){const c=$("#fx"),x=c.getContext("2d");if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 let w,h,ps=[];const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight;ps=Array.from({length:innerWidth<800?25:55},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+.3,v:Math.random()*.25+.05}))};rs();addEventListener("resize",rs);
 (function f(){x.clearRect(0,0,w,h);x.fillStyle="rgba(210,220,240,.5)";ps.forEach(p=>{p.y-=p.v;if(p.y<0)p.y=h;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});if(!document.hidden)requestAnimationFrame(f);else setTimeout(f,500)})()})();

/* init + loader (always removed after 2.4s max) */
render();
const hide=()=>$("#loader").classList.add("off");
setTimeout(hide,2000);addEventListener("load",()=>setTimeout(hide,1800));
</script>
</body>
</html>
